[package]
name = "agileeye"
version = "0.1.0"
description = "AgileEye pilot study prototype"
authors = ["AgileEye"]
edition = "2021"

[lib]
name = "agileeye_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
